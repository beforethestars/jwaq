<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>DAY6.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&family=Quicksand:wght@400;700&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-font: 'DotGothic16', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--main-font); background-color: #f7e6f3; color: #000000; padding-bottom: 80px; transition: font-family 0.2s ease; }

        /* NAVIGATION & HEADER */
        .top-nav { background-color: #df9be4; padding: 10px 20px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000000; }
        .nav-links a { color: #000000; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
        .header-logo { text-align: center; padding: 30px 10px; font-size: 32px; text-shadow: 2px 2px 0px #df9be4; }
        .main-container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* BUTTON BACK & WINDOW RETRO */
        .btn-back { display: inline-block; background: #e0e0e0; border: 2px solid #000000; box-shadow: 2px 2px 0px #000000; padding: 6px 12px; font-family: inherit; font-size: 13px; font-weight: bold; color: #000000; text-decoration: none; margin-bottom: 20px; cursor: pointer; }
        .btn-back:active { box-shadow: 0px 0px 0px #000000; transform: translate(2px, 2px); }
        .window { background: #ffffff; border: 2px solid #000000; box-shadow: 4px 4px 0px #000000; margin-bottom: 20px; }
        .window-header { background: #c3b1e1; border-bottom: 2px solid #000000; padding: 6px 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .window-controls span { border: 1px solid #000000; background: #ffffff; padding: 0 4px; font-size: 10px; cursor: pointer; }
        .window-body { padding: 25px; }
        .window-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .divider { border: none; border-top: 2px dashed #df9be4; margin-bottom: 20px; }

        /* FIC ITEMS & TAGS */
        .fic-item { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .fic-tag { background-color: #fbcce7; border: 1px solid #000000; border-radius: 12px; padding: 2px 10px; font-size: 13px; display: inline-block; }
        .fic-link { color: #000000; text-decoration: none; font-size: 16px; }
        .fic-link:hover { text-decoration: underline; }

        /* TASKBAR CHÂN TRANG */
        .taskbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background: #d4d0c8; border-top: 2px solid #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 9999; box-shadow: 0 -2px 0px #808080; }
        .start-button { background: #d4d0c8; border: 2px solid; border-color: #fff #555 #555 #fff; padding: 2px 8px; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .start-button:active { border-color: #555 #fff #fff #555; }
        .taskbar-right { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: bold; }
        .font-selector { background: #fff; border: 2px solid #000; font-family: 'Courier New', Courier, monospace; font-size: 12px; padding: 1px 5px; cursor: pointer; outline: none; font-weight: bold; }
        .systray-time { background: #d4d0c8; border: 2px solid; border-color: #555 #fff #fff #555; padding: 2px 8px; font-size: 11px; text-align: center; line-height: 1.2; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-links"><a href="index.html">TRANG CHỦ</a></div>
        <div><span>WELCOME TO LTQ'S HOUSE</span></div>
    </div>

    <div class="header-logo">👾 ltq.myday 👾</div>

    <div class="main-container">
        <a href="index.html" class="btn-back"> &lt; Về trang chủ </a>

        <div class="window">
            <div class="window-header">
                <span>DAY6.exe</span>
                <div class="window-controls"><span>X</span></div>
            </div>
            <div class="window-body">
                <h1 class="window-title">Tổng hợp bài dịch DAY6</h1>
                <div class="divider"></div>

                <div class="fic-item">
                    <span class="fic-tag">Interview</span>
                    <a href="241103_DAY6_JTBC_Newsroom.html" class="fic-link">DAY6 JTBC Newsroom</a>
                </div>
                <div class="fic-item">
                    <span class="fic-tag">Discussion</span>
                    <a href="250111_DAY6_lyrics.html" class="fic-link">Một vài phân tích ngẫu nhiên và không nghiêm túc về phần lời bài hát tiếng Anh của DAY6</a>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-block;">
            <div class="start-button"><span>🛸</span><span>START</span></div>
        </a>
        <div class="taskbar-right">
            <select id="font-select" class="font-selector">
                <option value="'DotGothic16', sans-serif">DotGothic16</option>
                <option value="'VT323', monospace">VT323</option>
                <option value="'Courier New', Courier, monospace">Courier New</option>
                <option value="'Be Vietnam Pro', sans-serif">Be Vietnam Pro</option>
            </select>
            <div class="systray-time" id="clock">00:00 AM<br>01/01/2026</div>
        </div>
    </div>

    <script>
        const fontSelect = document.getElementById('font-select'), clock = document.getElementById('clock');
        fontSelect.addEventListener('change', e => document.body.style.setProperty('--main-font', e.target.value));

        function updateClock() {
            const now = new Date(); 
            let h = now.getHours(), m = now.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM';
            let day = now.getDate(), month = now.getMonth() + 1, year = now.getFullYear();
            h = h % 12; h = h ? h : 12; m = m < 10 ? '0'+m : m;
            day = day < 10 ? '0'+day : day; month = month < 10 ? '0'+month : month;
            clock.innerHTML = `${h}:${m} ${ampm}<br>${day}/${month}/${year}`;
        }
        setInterval(updateClock, 1000); updateClock();

        /* Bảo mật: Chặn F12, Ctrl+U, Ctrl+Shift+I/J, Ctrl+S và Chuột phải (Vẫn cho copy văn bản) */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            let k = e.key.toLowerCase();
            if (e.key === 'F12' || (e.ctrlKey && (k === 'u' || k === 's')) || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j'))) e.preventDefault();
        });
    </script>
</body>
</html>
